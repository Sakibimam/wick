[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc_version = "0.8.30"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = false
bytecode_hash = "none"
fs_permissions = [{ access = "read", path = "../.progress/" }]
remappings = [
  "@uniswap/v4-core/=lib/v4-hooks-public/lib/v4-core/",
  "v4-core/=lib/v4-hooks-public/lib/v4-core/src/",
  "@uniswap/v4-periphery/=lib/v4-hooks-public/lib/v4-periphery/",
  "@protocol-fees/=lib/v4-hooks-public/lib/protocol-fees/src/",
  "@openzeppelin/contracts/=lib/v4-hooks-public/lib/openzeppelin-contracts/contracts/",
  "forge-std/=lib/v4-hooks-public/lib/forge-std/src/",
  "@v4-hooks/=lib/v4-hooks-public/src/"
]

[fuzz]
runs = 256

[rpc_endpoints]
base = "${BASE_RPC_URL}"

[lint]
lint_on_build = false
