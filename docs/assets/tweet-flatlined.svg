<text x="64" y="200" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="30" fill="#e7e9ea" font-weight="400">week 4 of torch. rough one honestly.</text><rect x="56" y="235" width="952" height="42" rx="6" fill="#f0625a" fill-opacity="0.16"/><text x="64" y="268" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="30" fill="#ffffff" font-weight="600">the host running my enclave ran out of credits and the agent</text><rect x="56" y="281" width="780" height="42" rx="6" fill="#f0625a" fill-opacity="0.16"/><text x="64" y="314" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="30" fill="#ffffff" font-weight="600">flatlined for 3 days in the middle of the league.</text><text x="64" y="382" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="30" fill="#e7e9ea" font-weight="400">and because the heartbeat is public everyone got to watch it</text><text x="64" y="428" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="30" fill="#e7e9ea" font-weight="400">happen live.</text><text x="64" y="496" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="30" fill="#e7e9ea" font-weight="400">thats the thing about building verifiable infra, your wins are on</text><text x="64" y="542" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="30" fill="#e7e9ea" font-weight="400">chain but so are your faceplants.</text><text x="64" y="610" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="30" fill="#e7e9ea" font-weight="400">anyway its back, 13k cycles deep and counting.</text>
