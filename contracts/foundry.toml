[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc_version = "0.8.30"
optimizer = true
optimizer_runs = 700
via_ir = true
remappings = [
  "@1inch/swap-vm/=lib/swap-vm/",
  "@1inch/aqua/src/=lib/aqua/contracts/",
  "@1inch/aqua/=lib/aqua/",
  "@1inch/solidity-utils/=lib/solidity-utils/",
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "forge-std/=lib/forge-std/src/"
]

[profile.default.fuzz]
runs = 1000

[profile.default.invariant]
runs = 256
depth = 64
fail_on_revert = false
show_metrics = true
